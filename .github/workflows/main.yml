name: Publish Package

on:
  push:
    branches:
      - 'main'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.BOT_ACCESS_TOKEN }}
      - name: Setup Git
        run: |
          git config --global user.name "dino-front-bot"
          git config --global user.email "dinofront.libs@gmail.com"

      - name: Specify Node Version
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Create .npmrc file
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_AUTH_TOKEN }}" > ~/.npmrc

      - name: Build
        run: npm run build

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: npm publish --access public

      - run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
      - run: echo "PACKAGE_NAME=$(node -p "require('./package.json').name")" >> $GITHUB_ENV
      - run: echo "PIPE_URL=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> $GITHUB_ENV

      - name: Send Adaptive Card to Teams
        env:
          PACKAGE_NAME: ${{ env.PACKAGE_NAME }}
          PACKAGE_VERSION: ${{ env.VERSION }}
          PR_REPOSITORY: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_NUMBER: ${{ github.run_number }}
          PIPE_URL: ${{ env.PIPE_URL }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          payload=$(jq -n \
            --arg packageAtVersion "$PACKAGE_NAME@$PACKAGE_VERSION" \
            --arg packageName "$PACKAGE_NAME" \
            --arg version "$PACKAGE_VERSION" \
            --arg repository "$PR_REPOSITORY" \
            --arg workflow "$WORKFLOW_NAME" \
            --arg runNumber "#$RUN_NUMBER" \
            --arg pipeUrl "$PIPE_URL" \
            --arg repoUrl "$REPO_URL" \
            '{
              type: "AdaptiveCard",
              "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
              version: "1.5",
              msteams: {
                width: "Full"
              },
              body: [
                {
                  type: "Container",
                  style: "good",
                  bleed: true,
                  items: [
                    {
                      type: "ColumnSet",
                      columns: [
                        {
                          type: "Column",
                          width: "auto",
                          items: [
                            {
                              type: "TextBlock",
                              text: "📦",
                              size: "ExtraLarge"
                            }
                          ]
                        },
                        {
                          type: "Column",
                          width: "stretch",
                          items: [
                            {
                              type: "TextBlock",
                              text: "NPM Package Published",
                              weight: "Bolder",
                              size: "Large",
                              wrap: true
                            },
                            {
                              type: "TextBlock",
                              text: $packageAtVersion,
                              spacing: "None",
                              color: "Good",
                              weight: "Bolder",
                              wrap: true
                            }
                          ]
                        }
                      ]
                    }
                  ]
                },
                {
                  type: "FactSet",
                  facts: [
                    { title: "Package", value: $packageName },
                    { title: "Version", value: $version },
                    { title: "Repository", value: $repository },
                    { title: "Workflow", value: $workflow },
                    { title: "Run Number", value: $runNumber }
                  ]
                }
              ],
              actions: [
                {
                  type: "Action.OpenUrl",
                  title: "🚀 View Pipeline",
                  url: $pipeUrl
                },
                {
                  type: "Action.OpenUrl",
                  title: "📂 Open Repository",
                  url: $repoUrl
                }
              ]
            }')

          curl -X POST "$TEAMS_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$payload"

      # Deployment on GitHub Pages
      - name: Build Storybook
        run: npm run build:storybook

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./storybook-static
          enable_jekyll: false